final String FRAMEWORK_PREBUILTS_DIR = "prebuilts"
def embeddedAdbSourceDir = file('shade/embedded-adb')
def embeddedAdbAssetsDir = file("$buildDir/generated/embedded-adb-assets")
def projectionShellAssetsDir = file("$buildDir/generated/projection-shell-assets")
def projectionShellApkDir = file("$rootDir/projection-shell-server/build/outputs/apk/debug")
def embeddedAdbAbiValue = project.hasProperty('embeddedAdbAbis')
        ? project.property('embeddedAdbAbis')
        : (project.hasProperty('embeddedAdbAbi')
        ? project.property('embeddedAdbAbi')
        : (System.getenv('EMBEDDED_ADB_ABIS') ?: System.getenv('EMBEDDED_ADB_ABI') ?: 'arm64-v8a'))
def requestedEmbeddedAdbAbis = embeddedAdbAbiValue
        .toString()
        .split(',')
        .collect { it.trim() }
        .findAll { !it.isEmpty() }

android {
    defaultConfig {
        applicationVariants.all { variant ->
            if (variant.flavorName.startsWith("shade")) {
                variant.outputs.each {
                    it.versionNameOverride new Date().format("yyyy-MM-dd HH:mm")
                    if (variant.buildType.name == "release") {
                        it.versionCodeOverride ((System.currentTimeMillis() / 60000) as int)
                    }
                }
            }
        }
    }

    productFlavors {
        shade {
            dimension "app"
            applicationId 'amirz.shade'
            testApplicationId 'amirz.shade.tests'
            versionName 'Q'
        }

        customUI {
            dimension "recents"
        }
    }

    sourceSets {
        shade {
            aidl.srcDirs = ['shade/aidl']
            assets.srcDirs = ['shade/assets', embeddedAdbAssetsDir, projectionShellAssetsDir]
            res.srcDirs = ['shade/res', 'shade/res_translations', 'shade/res_translations_manual']
            java.srcDirs = ['shade/src', 'shade/src_flags', 'src_shortcuts_overrides', 'shade/src_backport']
            manifest.srcFile "shade/AndroidManifest.xml"
        }

        customUI {
            java.srcDirs = ['shade/src_ui_overrides']
            res.srcDirs = ['shade/res_ui_overrides']
        }
    }

    dependencies {
        // Required for AOSP to compile. This is already included in the sysui_shared.jar
        customUIImplementation fileTree(dir: "${FRAMEWORK_PREBUILTS_DIR}/libs", include: 'plugin_core.jar')
    }

    dexOptions {
        javaMaxHeapSize "3g"
    }
}

task prepareEmbeddedAdbAssets {
    inputs.property("requestedEmbeddedAdbAbis", requestedEmbeddedAdbAbis.join(','))
    outputs.dir(embeddedAdbAssetsDir)

    doLast {
        delete embeddedAdbAssetsDir
        requestedEmbeddedAdbAbis.each { abi ->
            def sourceDir = new File(embeddedAdbSourceDir, abi)
            if (!sourceDir.isDirectory()) {
                throw new GradleException("Missing embedded adb payload for ABI '${abi}' at ${sourceDir}")
            }
            copy {
                from sourceDir
                into new File(embeddedAdbAssetsDir, "embedded-adb/${abi}")
            }
        }
    }
}

task prepareProjectionShellAssets {
    dependsOn ':ProjectionShellServer:assembleDebug'
    inputs.dir(projectionShellApkDir)
    outputs.dir(projectionShellAssetsDir)

    doLast {
        def shellApk = fileTree(dir: projectionShellApkDir, include: ['*-debug.apk']).singleFile
        if (shellApk == null || !shellApk.isFile()) {
            throw new GradleException("Missing projection shell server debug APK under ${projectionShellApkDir}")
        }
        delete projectionShellAssetsDir
        copy {
            from shellApk
            into projectionShellAssetsDir
            rename { 'projection-shell-server.jar' }
        }
    }
}

preBuild.dependsOn prepareEmbeddedAdbAssets, prepareProjectionShellAssets

apply from: 'shade/smali.gradle'
